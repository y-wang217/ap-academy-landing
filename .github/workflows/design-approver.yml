name: Design approver

# Hourly at :20, between the design (:05) and build (:35) Routines. Checks every
# card in Needs Approval against .claude/agents/design-approver.md and moves it to
# Approved or Revise, or leaves it for Charlie with a comment. Claude only returns
# a verdict (no tools); scripts/design-approver.mjs makes the Notion writes with
# the NOTION_APPROVER_TOKEN integration. Kill switch: Paused on Pipeline Control.
on:
  schedule:
    - cron: "20 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report verdicts in the run summary, write nothing to Notion"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: design-approver
  cancel-in-progress: false

jobs:
  approve:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check configuration
        id: cfg
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_APPROVER_TOKEN }}
        run: |
          if [ -z "$NOTION_TOKEN" ]; then
            echo "::notice::Skipped: set the NOTION_APPROVER_TOKEN repository secret (PIPELINE.md, Design approver)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.cfg.outputs.skip != 'true'

      - uses: actions/setup-node@v7
        if: steps.cfg.outputs.skip != 'true'
        with:
          node-version: 22

      - name: Unit tests
        if: steps.cfg.outputs.skip != 'true'
        run: node --test scripts/design-approver.test.mjs

      # Pinned: the script relies on --tools "" and --json-schema.
      - name: Install Claude Code
        if: steps.cfg.outputs.skip != 'true'
        run: npm install -g @anthropic-ai/claude-code@2.1.301

      - name: Review designed cards
        if: steps.cfg.outputs.skip != 'true'
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_APPROVER_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
        run: node scripts/design-approver.mjs
