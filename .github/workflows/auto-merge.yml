name: Auto-merge approved pipeline PRs

on:
  pull_request_review:
    types: [submitted]

jobs:
  enable-auto-merge:
    if: >
      github.event.review.state == 'approved' &&
      startsWith(github.event.pull_request.head.ref, 'req/') &&
      !contains(github.event.pull_request.labels.*.name, 'needs-human-merge')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Branch protection still requires green CI + 1 approval; this only queues the merge.
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --auto --squash --delete-branch
