packages:
  - "apps/*"
  - "packages/*"

# pnpm 10 blocks dependency install scripts unless listed. npm ran these under
# the old package-lock; sharp and unrs-resolver are native-binary fallbacks for
# next and eslint, esbuild (via vitest, tracker only) checks its binary.
onlyBuiltDependencies:
  - sharp
  - unrs-resolver
  - esbuild
